site_name: ShapeTensor
site_description: Orientation fields of any array, one or several directions per voxel, on the GPU
repo_url: https://github.com/Andrew-Keenlyside/ShapeTensor
theme:
  name: readthedocs
nav:
  - Introduction: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - The pipeline:
      - Overview: pipeline/index.md
      - 1. The lift: pipeline/lift.md
      - 2. Populations: pipeline/populations.md
      - 3. The field: pipeline/field.md
  - Parameters: parameters.md
  - The structure tensor, the baseline: structure_tensor.md
  - Validation and tracking: validation.md
  - Real data: data.md
  - API and command line: api.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
