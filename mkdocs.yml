site_name: ShapeTensor
site_description: Fibre orientation fields of high-resolution white-matter volumes from a pretrained shape-feature space, on the GPU
repo_url: https://github.com/Andrew-Keenlyside/ShapeTensor
theme:
  name: readthedocs
nav:
  - Introduction: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - The pipeline:
      - Overview: pipeline/index.md
      - 1. Shape features: pipeline/shape_features.md
      - 2. Separating populations: pipeline/separating.md
      - 3. One tensor per population: pipeline/tensors.md
      - 4. Merging the fields: pipeline/merging.md
  - The structure tensor, the baseline: structure_tensor.md
  - Validation on phantoms: validation.md
  - Real data: data.md
  - API and command line: api.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
